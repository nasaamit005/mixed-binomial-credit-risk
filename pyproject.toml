[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-binomial-credit-risk"
version = "0.1.0"
description = "Mixed-binomial credit risk: finite-sample accuracy of the Vasicek large-portfolio approximation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amit Singh" }]
dependencies = ["numpy>=2.0", "scipy>=1.11", "pandas>=2.0", "plotly>=5.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
app = ["streamlit>=1.66"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[project.urls]
Repository = "https://github.com/nasaamit005/mixed-binomial-credit-risk"
Documentation = "https://nasaamit005.github.io/mixed-binomial-credit-risk/"
